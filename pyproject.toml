[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenttrace"
version = "0.1.0"
description = "Multi-Agent Causal Tracing System for debugging complex agent interactions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Zhaohui Geoffrey Wang" }
]
keywords = ["agents", "debugging", "causal-tracing", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "networkx>=3.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.25",
]
llm = [
    "openai>=1.0",
    "anthropic>=0.7",
]

[project.urls]
Homepage = "https://github.com/GeoffreyWang1117/AgentTrace"
Paper = "https://arxiv.org/abs/2603.14688"

[project.scripts]
agenttrace = "agenttrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agenttrace"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
